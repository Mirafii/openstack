<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>${team_name}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    main {
      max-width: 32rem;
      padding: 2.5rem 3rem;
      border-radius: 0.75rem;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; color: #38bdf8; }
    p { margin: 0.25rem 0; color: #94a3b8; }
    code {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.375rem;
      background: #0f172a;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <main>
    <h1>${team_name}</h1>
    <p>Ce site tourne sur une VM OpenStack (Nova + nginx) provisionnée via Terraform.</p>
    <p>Domaine prévu : <code>${domain_name}</code></p>
  </main>
</body>
</html>
